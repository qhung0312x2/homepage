<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벽돌깨기</title>
  <style>
    body { margin: 24px; text-align: center; font-family: sans-serif; background: #f1f5f9; }
    canvas { max-width: 100%; background: white; border: 1px solid #334155; }
    button { display: block; margin: 12px auto; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>벽돌깨기</h1>
  <p>← → 키로 패들을 움직이세요.</p>
  <canvas id="game" width="480" height="320"></canvas>
  <button id="restart">다시 시작</button>
  <p id="message" aria-live="polite"></p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const keys = {};
    const rows = 5, cols = 8, brickW = 52, brickH = 16, gap = 6;
    let bricks, ball, paddle, playing;

    function reset() {
      bricks = Array.from({ length: rows }, () => Array(cols).fill(true));
      ball = { x: 240, y: 220, dx: 3, dy: -3, r: 7 };
      paddle = { x: 200, y: 290, w: 80, h: 10 };
      playing = true;
      message.textContent = "";
    }

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);
    document.getElementById("restart").addEventListener("click", reset);

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (keys.ArrowLeft) paddle.x -= 5;
      if (keys.ArrowRight) paddle.x += 5;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      bricks.forEach((row, r) => row.forEach((alive, c) => {
        if (!alive) return;
        const x = c * (brickW + gap) + 15, y = r * (brickH + gap) + 20;
        ctx.fillStyle = "#3b82f6";
        ctx.fillRect(x, y, brickW, brickH);
        if (ball.x + ball.r > x && ball.x - ball.r < x + brickW &&
            ball.y + ball.r > y && ball.y - ball.r < y + brickH) {
          row[c] = false;
          ball.dy *= -1;
        }
      }));

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (playing) {
        ball.x += ball.dx;
        ball.y += ball.dy;
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) ball.dx *= -1;
        if (ball.y < ball.r) ball.dy *= -1;
        if (ball.dy > 0 && ball.y + ball.r >= paddle.y &&
            ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) ball.dy *= -1;
        if (ball.y > canvas.height) {
          playing = false;
          message.textContent = "게임 오버!";
        } else if (bricks.every(row => row.every(brick => !brick))) {
          playing = false;
          message.textContent = "승리했습니다!";
        }
      }
      requestAnimationFrame(frame);
    }

    reset();
    frame();
  </script>
</body>
</html>
